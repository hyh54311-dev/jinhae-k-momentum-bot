name: K-Dual Momentum Quant Bot Auto Rebalance

on:
  schedule:
    # 1순위: Google Cloud Scheduler 웹훅 (workflow_dispatch)
    # 2순위 백업: GitHub 무료 schedule 큐 (정각 회피: 7분, 지연 흡수 여유: 10:07, 13:07 KST)
    - cron: '7 1 17-31 * *'    # UTC 01:07 = KST 10:07
    - cron: '7 4 17-31 * *'    # UTC 04:07 = KST 13:07
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (신호만 계산하고 주문은 내지 않음: 1=on, 0=off)'
        required: false
        default: '0'
      force:
        description: 'Force Execution (가동일 체크 우회 강제 집행: true/false)'
        required: false
        default: 'false'

# 동시 실행(중복 주문) 방지 락
concurrency:
  group: kis-rebalance-bot
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quant Rebalancing Bot
        env:
          KIS_MOMENTUM_APP_KEY: ${{ secrets.KIS_MOMENTUM_APP_KEY }}
          KIS_MOMENTUM_APP_SECRET: ${{ secrets.KIS_MOMENTUM_APP_SECRET }}
          KIS_PENSION_CANO: ${{ secrets.KIS_PENSION_CANO }}
          KIS_STOCK_CANO: ${{ secrets.KIS_STOCK_CANO }}
          KIS_MOCK_APP_KEY: ${{ secrets.KIS_MOCK_APP_KEY }}
          KIS_MOCK_APP_SECRET: ${{ secrets.KIS_MOCK_APP_SECRET }}
          KIS_MOCK_CANO1: ${{ secrets.KIS_MOCK_CANO1 }}
          KIS_MOCK_CANO2: ${{ secrets.KIS_MOCK_CANO2 }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_MOCK: ${{ secrets.KIS_MOCK || 'False' }}
          KIS_DRY_RUN: ${{ (github.event.inputs.dry_run == '1' || github.event.inputs.dry_run == 'true') && 'True' || secrets.KIS_DRY_RUN || 'False' }}
          DRY_RUN: ${{ (github.event.inputs.dry_run == '1' || github.event.inputs.dry_run == 'true') && '1' || '0' }}
          MAX_ORDER_AMOUNT: ${{ secrets.MAX_ORDER_AMOUNT || '1000000000' }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python kis_bot_multi.py --force
          else
            python kis_bot_multi.py
          fi

      - name: Alert Failure on Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🚨 [CRITICAL] GitHub Actions K-듀얼모멘텀 워크플로우 비정상 실패! 즉시 로그와 계좌를 확인하십시오. (Run ID: ${{ github.run_id }})"

